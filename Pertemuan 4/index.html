<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Split Bill</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Split Bill</h1>

    <p>
        Hitung biaya makan bersama teman.
    </p>


    <div class="card">

        <label>Harga Makanan</label>

        <input
            type="number"
            id="foodPrice"
            placeholder="Contoh: 50000"
        >


        <label>Harga Minuman</label>

        <input
            type="number"
            id="drinkPrice"
            placeholder="Contoh: 15000"
        >


        <label>Jumlah Teman</label>

        <input
            type="number"
            id="people"
            placeholder="Contoh: 3"
        >


        <button id="calculateButton">
            Hitung
        </button>

    </div>


    <div class="card">

        <h2>Hasil</h2>

        <div id="result">

            <p>
                Masukkan data terlebih dahulu.
            </p>

        </div>

    </div>


    <div class="card material">

        <h2>Materi</h2>

        <ul>
            <li>Variable</li>
            <li>Data Type</li>
            <li>Array</li>
            <li>Operator</li>
            <li>Function</li>
            <li>if / else</li>
        </ul>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
